spring.application.name=CreateOrder

spring.datasource.url=jdbc:mysql://localhost:3306/createOrder1
spring.datasource.username=root
spring.datasource.password=asma1234
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Niveau de logging
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Configuration de Swagger (SpringDoc)
springdoc.swagger-ui.enabled=true

# Compression des réponses HTTP
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024


# Désactiver le mapping des ressources statiques
spring.web.resources.add-mappings=false

# Configuration des messages internationaux
spring.messages.basename=messages

#Kafka:
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*